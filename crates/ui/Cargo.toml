[package]
name = "crossglide-ui"
description = "Crossglide tray app: runs the agent with a menu bar / tray icon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "crossglide"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossglide-agent.workspace = true
crossglide-audio.workspace = true
crossglide-touch.workspace = true
dirs = "7.0.0"
tao = "0.37"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tray-icon = "0.25"

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
