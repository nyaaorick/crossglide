[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
crossglide-agent = { path = "crates/agent" }
crossglide-audio = { path = "crates/audio" }

# Dev builds (`just dev`, `just test`) play real-time audio and simulate minutes of it, which the
# unoptimized resampler and codec can't keep up with. Optimize dependencies and the audio crate;
# they rarely change, so rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.crossglide-audio]
opt-level = 2
