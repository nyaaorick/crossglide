[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
crossglide-agent = { path = "crates/agent" }
crossglide-audio = { path = "crates/audio" }

# Everything runs from source as a dev build (no per-platform release builds until the app is
# mature), and dev builds play real-time audio and simulate minutes of it, which the unoptimized
# resampler and codec can't keep up with. Optimize dependencies and the audio crates; they rarely
# change, so rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.crossglide-audio]
opt-level = 2

[profile.dev.package.crossglide-spike]
opt-level = 2
